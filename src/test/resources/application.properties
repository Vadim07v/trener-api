# Настройки ТОЛЬКО для тестов: этот файл из src/test/resources
# заменяет основной application.properties, когда запускаются тесты.

# База H2 в оперативной памяти: создаётся при старте теста и исчезает после.
# MODE=PostgreSQL — вести себя как PostgreSQL. Твоя настоящая база не затрагивается.
spring.datasource.url=jdbc:h2:mem:trener;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=

# Пустую базу создаёт Flyway — теми же файлами V1, V2..., что и настоящую.
# Так тесты заодно проверяют, что миграции рабочие.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
