spring.application.name=trener-api

# Подключение к PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/trener
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# Таблицы теперь создаёт и меняет Flyway (файлы в db/migration).
# Hibernate только ПРОВЕРЯЕТ, что классы совпадают с таблицами. Не совпали — приложение не запустится.
spring.jpa.hibernate.ddl-auto=validate
# Показывать SQL-запросы в консоли
spring.jpa.show-sql=true

# База уже существует (её создал Hibernate). Flyway примет её за версию 1
# и дальше будет применять только новые файлы: V2, V3...
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

server.port=8080
